version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17.5
    container_name: angkutan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: angkutan_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: getsuga39
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./backend/src/migrations/seeder.sql:/docker-entrypoint-initdb.d/seeder.sql:ro
    networks:
      - angkutan_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d angkutan_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: angkutan_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: angkutan_db
      DB_USER: postgres
      DB_PASSWORD: getsuga39
      PORT: 3000
      HOST: "0.0.0.0"
      JWT_SECRET: your_super_secret_jwt_key_here_make_it_long_and_complex
      BASE_URL: http://localhost:3000
      GOOGLE_APPLICATION_CREDENTIALS: /app/src/config/angkutan-system-d87e3-ef128576fdb9.json
      FIREBASE_PROJECT_ID: angkutan-system
      AUTO_MIGRATE: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/src/config:/app/src/config:ro
    networks:
      - angkutan_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  angkutan_network:
    driver: bridge
