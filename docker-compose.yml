version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: angkutan_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development

      # 🌐 Use PostgreSQL installed on the VPS
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_NAME: cng_db
      DB_USER: cng_user
      DB_PASSWORD: awak1234
      DB_SSL: "false"

      PORT: 3000
      HOST: "0.0.0.0"
      JWT_SECRET: your_super_secret_jwt_key_here_make_it_long_and_complex

      BASE_URL: http://localhost:3000

      GOOGLE_APPLICATION_CREDENTIALS: /app/src/config/angkutan-system-d87e3-ef128576fdb9.json
      FIREBASE_PROJECT_ID: angkutan-system

      OPENAI_API_KEY:

      AUTO_MIGRATE: "true"

      CLOUDINARY_CLOUD_NAME: dvfxozwnt
      CLOUDINARY_API_KEY: 587735263442828
      CLOUDINARY_API_SECRET: mL-6CD2443SJgsDrIdTGBtNePgk

    ports:
      - "3000:3000"

    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/src/config:/app/src/config:ro

    networks:
      - angkutan_network

    depends_on: []

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  angkutan_network:
    driver: bridge
